<div class="feature-container">
  <h2>Digital Budget</h2>
  <div class="budget-controls">
    <p>Your weekly screen time budget: <b>{{format(totalBudget)}}</b></p>
    <div class="budget-split">
      <div *ngFor="let alloc of allocations">
        <b>{{alloc.label}}:</b> {{format(alloc.min)}}
      </div>
    </div>
    <p>Rollover: <b>+{{rollover}}m</b></p>
    <button class="primary" disabled>Adjust Budget</button>
    <small>Budget allocation per app (functionality stubbed).</small>
  </div>
</div>
